<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-white shadow-md sticky top-0 z-10">
      <div class="container mx-auto flex items-center justify-between py-4 px-6">
        <h1 class="text-xl font-extrabold text-gray-800">Messages</h1>
        <nav class="space-x-6">
          <a href="/home" class="text-gray-600 hover:text-gray-900 font-medium">Home</a>
          <a href="/profile" class="text-gray-600 hover:text-gray-900 font-medium">Profile</a>
        </nav>
      </div>
    </header>

    <!-- Main Section -->
    <main class="flex-grow flex">
      <!-- Sidebar: Followers List -->
      <aside class="w-1/4 bg-white border-r border-gray-200">
        <div class="p-6 border-b">
          <h2 class="text-lg font-bold text-gray-700">Followers</h2>
        </div>
        <ul class="overflow-y-auto h-full">
          <li class="p-4 flex items-center gap-4 hover:bg-gray-100 cursor-pointer">
            <img src="https://via.placeholder.com/40" alt="User" class="w-12 h-12 rounded-full">
            <div>
              <p class="text-gray-800 font-semibold">John Doe</p>
              <button class="text-blue-500 text-sm font-medium hover:underline">Message</button>
            </div>
          </li>
          <li class="p-4 flex items-center gap-4 hover:bg-gray-100 cursor-pointer">
            <img src="https://via.placeholder.com/40" alt="User" class="w-12 h-12 rounded-full">
            <div>
              <p class="text-gray-800 font-semibold">Jane Smith</p>
              <button class="text-blue-500 text-sm font-medium hover:underline">Message</button>
            </div>
          </li>
        </ul>
      </aside>

      <!-- Placeholder Section -->
      <section class="flex-grow flex flex-col justify-center items-center bg-gray-100">
        <p class="text-gray-500 text-lg">Select a follower to start messaging.</p>
      </section>
    </main>
  </div>
</body>
</html>
